services:
  api:
    build: .
    image: relcompat:latest
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  app:
    image: relcompat:latest
    depends_on:
      - api
    ports:
      - "8501:8501"
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
